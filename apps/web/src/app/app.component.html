@if (authService.hasValidSession()) {
  <div class="app-shell flex h-dvh flex-col overflow-hidden text-slate-100">
    <mat-toolbar class="app-toolbar shrink-0 px-4! text-white md:px-6!">
      <div class="mx-auto flex w-full max-w-7xl items-center gap-3">
        <div class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-slate-950/45 p-1.5 shadow-[0_0_0_1px_rgba(103,232,249,0.16)]">
          <img class="brand-symbol" src="assets/branding/atlas-symbol.png" alt="" />
        </div>
        <div class="flex min-w-0 flex-1 flex-col justify-center">
          <div class="text-base font-semibold leading-tight tracking-wide text-white">Atlas Supply</div>
          <div class="mt-0.5 text-xs font-normal leading-none text-slate-300">Operations intelligence</div>
        </div>
        <button mat-button type="button" class="logout-action shrink-0 text-slate-300!" (click)="authService.logout()">
          <mat-icon>logout</mat-icon>
          <span class="hidden sm:inline">Sign out</span>
        </button>
      </div>
    </mat-toolbar>

    <main class="mx-auto flex min-h-0 w-full max-w-7xl flex-1 overflow-hidden px-4 py-3 md:p-6">
      <section class="chat-panel flex min-h-0 flex-1 overflow-hidden rounded-xl shadow-[0_24px_60px_-34px_rgba(0,0,0,0.9)] md:rounded-2xl" aria-label="Atlas Supply assistant">
        <router-outlet />
      </section>
    </main>
  </div>
} @else {
  <router-outlet />
}
