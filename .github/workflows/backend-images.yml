name: Build backend images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/jackdaw16/atlas-supply-api
  MCP_IMAGE: ghcr.io/jackdaw16/atlas-supply-mcp

jobs:
  verify-backend:
    name: Restore, build, and test backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore AtlasSupply.sln

      - name: Build solution
        run: dotnet build AtlasSupply.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test AtlasSupply.sln --configuration Release --no-build

  publish-images:
    name: Build and publish backend images
    needs: verify-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/AtlasSupply.Api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:bootstrap
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=atlas-supply-api
          cache-to: type=gha,mode=max,scope=atlas-supply-api

      - name: Build and publish MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp/AtlasSupply.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:bootstrap
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=atlas-supply-mcp
          cache-to: type=gha,mode=max,scope=atlas-supply-mcp
