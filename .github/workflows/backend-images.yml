name: Build backend images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/jackdaw16/atlas-supply-api
  MCP_IMAGE: ghcr.io/jackdaw16/atlas-supply-mcp

jobs:
  verify-backend:
    name: Restore, build, and test backend
    runs-on: ubuntu-latest
    env:
      POSTGRESQL_CONNECTION_STRING: Host=localhost;Port=5432;Database=atlas_supply;Username=atlas;Password=atlas
      JWT_SIGNING_KEY: ci-only-signing-key-with-at-least-thirty-two-bytes
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlas_supply
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_supply"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore AtlasSupply.sln

      - name: Build solution
        run: dotnet build AtlasSupply.sln --configuration Release --no-restore

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply CI database migrations
        run: dotnet ef database update --project libs/AtlasSupply.Infrastructure --startup-project apps/api/AtlasSupply.Api --configuration Release --no-build

      - name: Test solution
        run: dotnet test AtlasSupply.sln --configuration Release --no-build

  publish-images:
    name: Build and publish backend images
    needs: verify-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/AtlasSupply.Api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:bootstrap
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=atlas-supply-api
          cache-to: type=gha,mode=max,scope=atlas-supply-api

      - name: Build and publish MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp/AtlasSupply.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:bootstrap
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=atlas-supply-mcp
          cache-to: type=gha,mode=max,scope=atlas-supply-mcp
