name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - apps/web/package.json
      - apps/web/package-lock.json
      - apps/web/angular.json
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production frontend
        working-directory: apps/web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          : "${API_BASE_URL:?Set the API_BASE_URL repository variable before deployment.}"
          npm run build -- --configuration production --define "API_BASE_URL='${API_BASE_URL}'"

      - name: Verify production output
        working-directory: apps/web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          BUILD_OUTPUT=dist/atlas-supply-web/browser
          test -f "$BUILD_OUTPUT/index.html"
          test -f "$BUILD_OUTPUT/_redirects"
          grep -R -F "$API_BASE_URL" "$BUILD_OUTPUT"
          ! grep -R -E "OPENAI_API_KEY|JWT_SIGNING_KEY|NEON_(RUNTIME|MIGRATION)_CONNECTION_STRING|GOOGLE_CREDENTIAL" "$BUILD_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist/atlas-supply-web/browser --project-name=atlas-supply-web --branch=main --commit-hash=${{ github.sha }}
